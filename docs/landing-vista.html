  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading TradeMind...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

Bricolage Grotesque e Instrument Sans. Las réplicas del dashboard\n   (clase .d) usan Space Grotesk e IBM Plex Mono, las fuentes reales del producto,\n   con sus mismos colores, tarjetas, calendario, curva y radar. */\nbody{margin:0;background:#05060B;color:#F1F2F6;font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n*,*::before,*::after{box-sizing:border-box}\na{color:inherit;text-decoration:none}\nbutton{font-family:inherit}\n.disp{font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;letter-spacing:-.025em;text-wrap:balance}\n.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}\n.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px}\n.sec{padding-top:112px;padding-bottom:112px;border-top:1px solid rgba(255,255,255,.07)}\n.eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#2FD8C8}\n.h2{font-size:clamp(30px,4vw,48px);line-height:1.06;font-weight:600;margin:14px 0 0}\n.lead{font-size:18px;line-height:1.6;color:#A3A8BC;max-width:560px;margin:18px 0 0}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:transform .15s ease,background .15s ease,border-color .15s ease}\n.btn-lg{height:52px;padding:0 26px;font-size:16px;border-radius:14px}\n.btn-p{background:#2FD8C8;color:#04211E}\n.btn-p:hover{background:#5BE6D8;transform:translateY(-1px)}\n.btn-g{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.16);color:#F1F2F6}\n.btn-g:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.3)}\na:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #2FD8C8;outline-o aqEyebrow: \"Preguntas\", faqTitle: \"Lo que suelen preguntarnos\",\n        faqNote: \"¿Te queda algo por resolver? Crea tu cuenta y pruébalo con tu propio reporte.\",\n        faq: [\n          { q: \"¿Tengo que conectar mi broker?\", a: \"No. TradeMind nunca se conecta a tu broker ni te pide tus credenciales. Subes un archivo y listo.\" },\n          { q: \"¿Funciona si no uso MetaTrader?\", a: \"Sí. La lectura de MT5 es automática, pero con la plantilla de Excel o la entrada manual puedes traer cualquier broker.\" },\n          { q: \"¿Quién puede ver mis datos?\", a: \"Solo tú. No compartimos tus operaciones con nadie ni las usamos para nada fuera de tu propia cuenta.\" },\n          { q: \"¿Puedo llevar varias cuentas?\", a: \"Sí. Cada cuenta conserva su saldo, su moneda y su historial, y puedes analizarlas por separado.\" },\n          { q: \"¿Cuánto tardo en ver algo?\", a: \"En cuanto termina la importación, que es inmediata. No hay nada que esperar.\" },\n          { q: \"¿Puedo corregir una operación?\", a: \"Sí. Editar y borrar operaciones está en el propio dashboard.\" }\n        ],\n        finalTitle: \"Empieza por conocer la verdad.\",\n        finalBody: \"Crea una cuenta y sube tu reporte. Te lleva menos tiempo que decidir si esto te sirve.\",\n        legalTitle: \"Aviso\",\n        legalBody: \"TradeMind es una herramienta de registro y análisis. No ofrecemos recomendaciones de inversión ni asesoría financiera, y no operamos en tu nombre. El trading con apalancamiento conlleva un alto nivel de riesgo y puede resultar en la pérdida total del capital invertido. Ninguna estadística o resultado mostrado en este sitio es una promesa de rendimiento futuro.\",\n        rights: \"Todos los derechos reservados.\"\n      },\n      en: {\n        navProduct: \"Product\", navImport: \"Import\", navFaq: \"Questions\",\n        login: \"Sign in\", signup: \"Create account\",\n        badge: \"Trading journal\",\n        h1a: \"The trading journal that tells you\", h1b: \"how you win.\",\n        heroSub: \"Upload your broker's real report and look at your numbers: win rate, profit factor, which days you make money and how much risk you take. Without trading a single position.\",\n        cta1: \"Create account\", cta2: \"See how it works\",\n        trust1: \"No broker connection\", trust2: \"The report, as MT5 exports it\", trust3: \"Spanish and English\",\n        sample: \"Sample data\", sampleNote: \"The interface is the dashboard's own; the figures are sample data.\",\n        tab1: \"Dashboard\", tab2: \"Trades\", tab3: \"Accounts\", tab4: \"Analytics\",\n        chartAria: \"Daily cumulative P&L curve of a sample account\",\n        chipFile: \"ReportHistory.xlsx\", chipFormat: \"MetaTrader 5 detected\", chipBest: \"Best day\",\n        allTimeTitle: \"Whole-account performance\",\n        allTimeNote: \"These figures don't change as you browse the calendar. The month only moves the days and their summaries.\",\n        chartPanelTitle: \"Daily cumulative P&L\", chartMonth: \"February 2026\",\n        bandHint: \"Teal band: the month you're viewing in the calendar. The line covers all your history.\",\n        stripLabel: \"Import from\", strip1: \"MetaTrader 5\", strip2: \"Excel template\", strip3: \"Generic CSV and Excel\", strip4: \"Manual entry\",\n        probEyebrow: \"The problem\",\n        probTitle: \"You know what you made last month. You don't know why.\",\n        probLead: \"Every trader knows how much they made. Almost none knows why. And without that answer, every decision is still a guess.\",\n        problems: [\n          { title: \"You trade blind\", body: \"You know you were profitable. You don't know which weekday, what time, or on which symbol you actually make money.\" },\n          { title: \"The total result says nothing\", body: \"Twelve months and +8% won't tell you whether that was one good streak and eleven bad ones, or the other way round.\" },\n          { title: \"Nobody points out \"Your score, across six axes\", rSub: \"Not one overall grade: it tells you which specific axis is weak.\", scoreTitle: \"Trader score\", rAria: \"Six-axis radar with a sample score\",\n        ax1: \"% Win rate\", ax2: \"Profit factor\", ax3: \"Win/loss ratio\", ax4: \"Recovery\", ax5: \"Max drawdown\", ax6: \"Consistency\",\n        moreViews: [\n          { title: \"Trades\", body: \"A table with date filters, the columns you choose, sorting, pagination, and the ability to edit or delete every trade.\" },\n          { title: \"Accounts\", body: \"Several accounts, each with its balance, its currency and its source. Switch between them without losing anything.\" },\n          { title: \"Analytics\", body: \"Performance by symbol, with five cards and a selector for metric and sort order.\" }\n        ],\n        importEyebrow: \"What sets us apart\",\n        importTitle: \"Importing is the hard part. Here it's the easy one.\",\n        importLead: \"Almost every journal falls apart right here: columns that don't match, dates that won't parse, trades that get lost. TradeMind reads the MT5 report directly. And if your broker isn't MT5, you have the Excel template and manual entry.\",\n        methods: [\n          { name: \"MetaTrader 5\", body: \"The closed-trades report is imported exactly as the broker generates it.\" },\n          { name: \"Excel template\", body: \"A template with the columns you need. You fill it in and upload it.\" },\n          { name: \"Manual entry\", body: \"If you'd rather add them one by one, you can.\" },\n          { name: \"Universal reader\", body: \"Generic CSV and Excel files: it reads the table and proposes the columns for you.\" }\n        ],\n        dropTitle: \"Drop your report here\",\n        mockK: [\"File\", \"Format\", \"Closed positions\", \"Result\"],\n        mockV: [\"ReportHistory.xlsx\", \"MetaTrader 5 · Positions section\", \"152\", \"152 trades saved\"],\n        faqEyebrow: \"Questions\", faqTitle: \"What people usually ask us\",\n        faqNote: \"Anything left to settle? Create your account and try it with your own report.\",\n        faq: [\n          { q: \"Do I have to connect my broker?\", a: \"No. TradeMind never connects to your broker and never asks for your credentials. You upload a file and you're done.\" },\n          { q: \"Does it work if I don't use MetaTrader?\", a: \"Yes. The MT5 reader is automatic, but with the Excel template or manual entry you can bring in any broker.\" },\n          { q: \"Who can see my data?\", a: \"Only you. We don't share trades with anyone and don't use them for anything outside your own account.\" },\n          { q: \"Can I track several accounts?\", a: \"Yes. Each account keeps its balance, its currency and its history, and you can analyse them separately.\" },\n          { q: \"How long until I see anything?\", a: \"As soon as the import finishes, which is immediate. There's nothing to wait for.\" },\n          { q: \"Can I correct a trade?\", a: \"Yes. Editing and deleting trades is right there in the dashboard.\" }\n        ],\n        finalTitle: \"Start by knowing the truth.\",\n        finalBody: \"Create an account and upload your report. It takes you less time than deciding whether this is useful to you.\",\n        legalTitle: \"Notice\",\n        legalBody: \"TradeMind is a record-keeping and analysis tool. We do not provide investment recommendations or financial advice, and we do not trade on your behalf. Leveraged trading carries a high level of risk and can result in the total loss of your invested capital. No statistic or result shown on this website is a promise of future performance.\",\n        rights: \"All rights reserved.\"\n      }\n    };\n  }\n\n  money(v, plus) {\n    const a = Math.abs(v).toFixed(2).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\n    if (v < 0) return '−$' + a;\n    return (plus ? '+$' : '$') + a;\n  }\n\n  // Curva suavizada con la misma tension (0.4) que usa Chart.js en el dashboard.\n  smoothPath(pts, tension) {\n    const n = pts.length;\n    const f = (v) => v.toFixed(1);\n    const ctrl = (a, b, c) => {\n      const d01 = Math.hypot(b[0] - a[0], b[1] - a[1]);\n      const d12 = Math.hypot(c[0] - b[0], c[1] - b[1]);\n      const s = (d01 + d12) || 1;\n      const fa = tension * d01 / s;\n      const fb = tension * d12 / s;\n      const dx = c[0] - a[0];\n      const dy = c[1] - a[1];\n      return { p: [b[0] - fa * dx, b[1] - fa * dy], n: [b[0] + fb * dx, b[1] + fb * dy] };\n    };\n    const cs = pts.map((p, i) => (i === 0 || i === n - 1) ? { p: p, n: p } : ctrl(pts[i - 1], p, pts[i + 1]));\n    let d = 'M' + f(pts[0][0]) + ',' + f(pts[0][1]);\n    for (let i = 0; i < n - 1; i++) {\n      d += ' C' + f(cs[i].n[0]) + ',' + f(cs[i].n[1]) + ' ' + f(cs[i + 1].p[0]) + ',' + f(cs[i + 1].p[1]) + ' ' + f(pts[i + 1][0]) + ',' + f(pts[i + 1][1]);\n    }\n    return d;\n  }\n\n  renderVals() {\n    const lang = this.state.lang === 'en' ? 'en' : 'es';\n    const t = this.dict()[lang];\n    const GREEN = '#2FD8B8';\n    const RED = '#FF4D6D';\n    const dateLabel = (mon, d) => lang === 'es' ? (d + ' ' + t.monthAbbr[mon]) : (t.monthAbbr[mon] + ' ' + d);\n\n    // ---- Datos de ejemplo, coherentes entre si ----\n    // Enero (solo dias con operaciones) y febrero (filas domingo a sabado, null = sin operaciones).\n    const jan = [[26, 96.40], [28, -38.20], [29, 71.85], [30, 84.00]];\n    const feb = [\n      [null, 222.90, -48.60, 96.40, null, null, null],\n      [null, 58.20, 142.60, -73.40, 109.85, null, null],\n      [null, null, 187.35, -52.10, 96.70, 61.45, null],\n      [null, 131.10, -96.25, 104.60, 54.30, 99.80, null]\n    ];\n\n    // ---- Calendario de febrero ----\n    const dowHead = t.dow.map((label, i) => ({ label: label, cls: (i === 0 || i === 6) ? 'ddow fin' : 'ddow' }));\n    const calCells = [];\n    let febTotal = 0;\n    let febDays = 0;\n    let best = { v: -Infinity, n: 0 };\n    let worst = { v: Infinity, n: 0 };\n    feb.forEach((row, r) => {\n      let sum = 0;\n      let cnt = 0;\n      row.forEach((v, c) => {\n        const n = r * 7 + c + 1;\n        const key = r + '-' + c;\n        if (v === null) {\n          calCells.push({ key: key, cls: 'dday', top: String(n), mid: '', bot: '', extra: '', botColor: '#8E93A6' });\n          return;\n        }\n        sum += v;\n        cnt += 1;\n        febTotal += v;\n        febDays += 1;\n        if (v > best.v) best = { v: v, n: n };\n        if (v < worst.v) worst = { v: v, n: n };\n        calCells.push({ key: key, cls: v >= 0 ? 'dday win' : 'dday loss', top: String(n), mid: '', bot: this.money(v, true), extra: '', botColor: v >= 0 ? GREEN : RED });\n      });\n      const first = r * 7 + 1;\n      const last = r * 7 + 7;\n      const range = lang === 'es' ? (first + '–' + last + ' feb') : ('Feb ' + first + '–' + last);\n      const wkName = t.weekWord + ' ' + (r + 1);\n      if (cnt === 0) {\n        calCells.push({ key: r + '-w', cls: 'dwk vacia', top: wkName, mid: range, bot: t.noTrades, extra: '', botColor: '#8E93A6' });\n      } else {\n        calCells.push({ key: r + '-w', cls: 'dwk', top: wkName, mid: range, bot: this.money(sum, false), extra: cnt + ' ' + (cnt === 1 ? t.dayOne : t.dayMany), botColor: sum >= 0 ? GREEN : RED });\n      }\n    });\n    const calBest = { val: this.money(best.v, true), date: dateLabel(1, best.n) };\n    const calWorst = { val: this.money(worst.v, false), date: dateLabel(1, worst.n) };\n    const calTotal = { val: this.money(febTotal, true) };\n    const calDays = { val: String(febDays) };\n\n    // ---- Curva de P&L acumulado diario (enero + febrero, con la franja de febrero) ----\n    const seq = [];\n    jan.forEach((j) => seq.push(j[1]));\n    feb.forEach((row) => row.forEach((v) => { if (v !== null) seq.push(v); }));\n    let cum = 0;\n    const cums = seq.map((v) => { cum += v; return cum; });\n    const x0 = 78;\n    const step = 27.5;\n    const yOf = (v) => 216 - v / 1400 * 196;\n    const pts = cums.map((c, i) => [x0 + i * step, yOf(c)]);\n    const line = this.smoothPath(pts, 0.4);\n    const lastPt = pts[pts.length - 1];\n    const firstFeb = jan.length;\n    const bandX = x0 + firstFeb * step - step / 2;\n    const bandEnd = Math.min(620, lastPt[0] + step / 2);\n    const chart = {\n      line: line,\n      area: line + ' L' + lastPt[0].toFixed(1) + ',216 L' + x0 + ',216 Z',\n      dots: pts.map((p) => 'M' + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' h0').join(' '),\n      bandX: bandX.toFixed(1),\n      bandW: (bandEnd - bandX).toFixed(1)\n    };\n    const ticks = { a: dateLabel(0, 26), b: dateLabel(1, 2), c: dateLabel(1, 10), d: dateLabel(1, 18), e: dateLabel(1, 27) };\n\n    // ---- Metricas globales ----\n    // Enero + febrero = P&L neto; balance = 10,000 de partida + P&L neto; 152 trades, 109 ganados y 43 perdidos.\n    const janTotal = jan.reduce((s, j) => s + j[1], 0);\n    const net = janTotal + febTotal;\n    const winrate = 109 / 152 * 100;\n    const heroKpis = [\n      { label: t.kn[0], value: this.money(10000 + net, false), color: GREEN, bar: '0%', barDisplay: 'none' },\n      { label: t.kn[1], value: this.money(net, false), color: GREEN, bar: '0%', barDisplay: 'none' },\n      { label: t.kn[2], value: winrate.toFixed(2) + '%', color: '#F1F2F6', bar: winrate.toFixed(2) + '%', barDisplay: 'block' },\n      { label: t.kn[4], value: '3.24', color: '#F1F2F6', bar: '0%', barDisplay: 'none' }\n    ];\n    const mk = (i, value, color, extra) => Object.assign({\n      label: t.kn[i], value: value, color: color,\n      bar: '0%', barDisplay: 'none', infoDisplay: 'none', noteDisplay: 'none', noteA: '', noteB: ''\n    }, extra || {});\n    const bentoKpis = [\n      mk(0, this.money(10000 + net, false), GREEN),\n      mk(1, this.money(net, false), GREEN),\n      mk(2, winrate.toFixed(2) + '%', '#F1F2F6', { bar: winrate.toFixed(2) + '%', barDisplay: 'block' }),\n      mk(3, '1.28', '#F1F2F6'),\n      mk(4, '3.24', '#F1F2F6'),\n      mk(5, '152', '#F1F2F6', { noteDisplay: 'block', noteA: '109 ' + t.won, noteB: '43 ' + t.lost }),\n      mk(6, this.money(net / 152, false), GREEN, { infoDisplay: 'inline-flex' }),\n      mk(7, '49m 33s', '#F1F2F6')\n    ];\n\n    // ---- Radar de seis ejes (arriba, en sentido horario) ----\n    const cx = 190;\n    const cy = 120;\n    const R = 80;\n    const ang = [-90, -30, 30, 90, 150, 210].map((a) => a * Math.PI / 180);\n    const at = (i, r) => [cx + r * Math.cos(ang[i]), cy + r * Math.sin(ang[i])];\n    const fp = (arr) => arr.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');\n    const ring = (s) => fp([0, 1, 2, 3, 4, 5].map((i) => at(i, R * s)));\n    const vals = [0.66, 1.0, 0.12, 1.0, 0.94, 0.78];\n    const dataPts = vals.map((v, i) => at(i, R * v));\n    const radar = {\n      r1: ring(0.2), r2: ring(0.4), r3: ring(0.6), r4: ring(0.8), r5: ring(1),\n      axes: [0, 1, 2, 3, 4, 5].map((i) => { const p = at(i, R); return 'M' + cx + ',' + cy + ' L' + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '),\n      data: fp(dataPts),\n      dots: dataPts.map((p) => 'M' + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' h0').join(' ')\n    };\n    for (let i = 0; i < 6; i++) {\n      const lp = at(i, R + 16);\n      radar['l' + i + 'x'] = lp[0].toFixed(1);\n      radar['l' + i + 'y'] = (lp[1] + 4).toFixed(1);\n    }\n\n    const dots = ['#2FD8C8', '#E22FA0', '#9A6BFF', '#2FD8B8'];\n    const methods = t.methods.map((m, i) => ({ name: m.name, body: m.body, dot: dots[i] }));\n    const mockRows = t.mockK.map((k, i) => ({ k: k, v: t.mockV[i], c: i === 3 ? '#8CF3E3' : '#F1F2F6' }));\n\n    return {\n      t: t,\n      setEs: () => this.setState({ lang: 'es' }),\n      setEn: () => this.setState({ lang: 'en' }),\n      esOn: lang === 'es', enOn: lang === 'en',\n      esBg: lang === 'es' ? '#2FD8C8' : 'transparent', esFg: lang === 'es' ? '#04211E' : '#A3A8BC',\n      enBg: lang === 'en' ? '#2FD8C8' : 'transparent', enFg: lang === 'en' ? '#04211E' : '#A3A8BC',\n      chart: chart,
